<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Room in 3D</title>

    <meta itemprop="name" content="My Room in 3D — Experiment">
    <meta itemprop="description" content="WebGL experiment with Three.js">
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/houssemlachtar/My-3D-Room/main/src/3DRoomLogo.ico">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300&display=swap" rel="stylesheet">
</head>
<body>
    <div class="experience"></div>
    
    <!-- Loading Screen -->
    <div class="loading-screen" id="loading-screen">
        <!-- Glass morphism overlays -->
        <div class="loading-overlay overlay-1"></div>
        <div class="loading-overlay overlay-2"></div>
        
        <!-- Floating glass panels -->
        <div class="glass-panel panel-1"></div>
        <div class="glass-panel panel-2"></div>
        <div class="glass-panel panel-3"></div>
        
        <div class="loading-content">
            <h1 class="loading-title">THE ROOM</h1>
            
            <div class="loading-middle">
                <p class="loading-status" id="loading-status">Initializing 3D environment...</p>
                
                <div class="loading-branding">
                    <p class="loading-by">Portfolio by</p>
                    <h2 class="loading-author">Prasidh P Shetty</h2>
                </div>
                
                <div class="loading-progress-container">
                    <div class="loading-bar-bg">
                        <div class="loading-bar" id="loading-bar"></div>
                        <div class="loading-shine" id="loading-shine"></div>
                    </div>
                    <div class="loading-percent" id="loading-percent">0%</div>
                </div>
            </div>
            
            <div class="loading-bottom">
                <p class="loading-year">2026</p>
                <p class="loading-subtitle">A 3D Portfolio Experience</p>
                <div class="loading-btn-container">
                    <button class="loading-start-btn" id="loading-start-btn">START</button>
                </div>
            </div>
        </div>
        
        <!-- Floating dots -->
        <div class="floating-dot dot-1"></div>
        <div class="floating-dot dot-2"></div>
        <div class="floating-dot dot-3"></div>
    </div>
    
    <div class="info-panel" id="info-panel">
        <div class="info-box info-name" id="info-name"><span id="info-name-text"></span><span class="info-cursor" id="name-cursor">|</span></div>
        <div class="info-box info-role" id="info-role"><span id="info-role-text"></span><span class="info-cursor" id="role-cursor">|</span></div>
        <div class="info-row" id="info-row">
            <div class="info-box info-time" id="live-time"></div>
            <div class="info-box info-icon" id="sound-toggle" style="cursor: pointer;">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" id="sound-icon-on">
                    <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                </svg>
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" id="sound-icon-off" style="display: none;">
                    <path d="M16.5 12c0-1.77-1.02-3.29-2.5-4.03v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51C20.63 14.91 21 13.5 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06c1.38-.31 2.63-.95 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>
                </svg>
            </div>
            <div class="info-box info-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/>
                </svg>
            </div>
        </div>
    </div>
    
    <button id="theme-toggle" onclick="window.toggleTheme && window.toggleTheme()">
        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
            <path d="M12 22C6.477 22 2 17.523 2 12S6.477 2 12 2s10 4.477 10 10-4.477 10-10 10zm0-2V4a8 8 0 1 0 0 16z"/>
        </svg>
    </button>
    
    <!-- Click anywhere prompt -->
    <div class="click-prompt" id="click-prompt">
        <span id="click-prompt-text"></span><span class="cursor-blink">__</span>
    </div>
    
    <div class="credits">
        Made by <a href="https://fbi.watch/ps" target="_blank">Prasidh</a>
    </div>
    
    <!-- Ambient background music - local file -->
    <audio id="ambient-audio" preload="auto">
        <source src="Screen Recording 2026-01-13 193232.mp3" type="audio/mpeg">
    </audio>
</body>

</html>
